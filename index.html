<!DOCTYPE html>
<html>
<head>
<title>Library Seat Booking</title>
</head>
<body>

<h1>Library Seat and Resource Booking System</h1>
<p>Available seats in library.</p>
<br>

<h2>Seat Map</h2>

<table border="1">
  <tr>
    <th>Row</th> <th>Seat 1</th> <th>Seat 2</th> <th>Seat 3</th>
  </tr>
  <tr>
    <td>A</td> <td>A-01 free</td> <td>A-02 free</td> <td>A-03 taken</td>
  </tr>
  <tr>
    <td>B</td> <td>B-01 free</td> <td>B-02 taken</td> <td>B-03 free</td>
  </tr>
  <tr>
    <td>C</td> <td>C-01 free</td> <td>C-02 free</td> <td>C-03 free</td>
  </tr>
</table>

<h2>Book a seat</h2>
<form action="#" method="post">
<p>Name : <input type="text" name="sname" placeholder="your name"></p>
<p>Roll no : <input type="text" name="roll"></p>
<p>Seat code : <input type="text" name="seat" placeholder="A-01"></p>
<p>Date : <input type="date" name="date"></p>
<p>Slot :
<select name="slot">
  <option>9am - 12pm</option>
  <option>12pm - 3pm</option>
  <option>3pm - 6pm</option>
</select>
</p>
<p><input type="submit" value="Book"></p>
</form>

<p>CA1 - CSE326</p>

</body>
</html>
